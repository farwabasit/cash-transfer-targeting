name: dbt build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # mondays 06:00 UTC
  workflow_dispatch:

jobs:
  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: CT_SERVICE
      SNOWFLAKE_ROLE: CT_PIPELINE
      SNOWFLAKE_WAREHOUSE: CT_WH
      SNOWFLAKE_DATABASE: CASH_TRANSFER
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/.secrets/snowflake_key.p8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: snowflake key from secret
        env:
          KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          mkdir -p .secrets
          printf '%s\n' "$KEY" > .secrets/snowflake_key.p8

      - name: dbt build (models + tests)
        run: python transform/run_dbt.py build

      - name: source freshness
        run: python transform/run_dbt.py source freshness
        continue-on-error: true
