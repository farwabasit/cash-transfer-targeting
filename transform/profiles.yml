# No secrets here: everything comes from environment variables (.env locally, GitHub secrets in CI).
# dev = the real tables (main branch, local runs). ci = branch builds, written to CI_ schemas.
cash_transfer:
  target: dev
  outputs:
    dev: &snowflake
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: DEV
      threads: 4
    ci:
      <<: *snowflake
      schema: CI
