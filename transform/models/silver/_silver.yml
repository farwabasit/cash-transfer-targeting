version: 2

models:
  # uganda
  - name: slv_uganda_consumption_items
    description: One row per household x wave x consumption item, with the monthly value in UGX.
    tests:
      - unique_combination: {arguments: {columns: [household_id, wave, item]}}
    columns:
      - name: household_id
        tests: [not_null]
      - name: wave
        tests:
          - accepted_values: {arguments: {values: [baseline_2019, endline_2022]}}
      - name: monthly_value_lcu
        tests:
          - in_range: {arguments: {min_value: 0}}

  - name: slv_uganda_household_consumption
    description: Monthly consumption per person in UGX and PPP $, top 1% winsorised per wave.
    config:
      contract: {enforced: true}
    tests:
      - unique_combination: {arguments: {columns: [household_id, wave]}}
    columns:
      - name: household_id
        data_type: varchar
        constraints: [{type: not_null}]
        tests:
          - relationships: {arguments: {to: ref('slv_uganda_households'), field: household_id}}
      - name: country
        data_type: varchar
      - name: wave
        data_type: varchar
        constraints: [{type: not_null}]
      - name: survey_year
        data_type: number
      - name: hh_size
        data_type: float
        tests:
          - in_range: {arguments: {min_value: 1, max_value: 40}}
      - name: food_monthly_lcu
        data_type: float
        tests: [not_null]
      - name: nonfood_monthly_lcu
        data_type: float
        tests: [not_null]
      - name: total_monthly_lcu
        data_type: float
        tests:
          - in_range: {arguments: {min_value: 0}}
      - name: total_monthly_lcu_w
        data_type: float
      - name: consumption_pc_lcu
        data_type: float
      - name: consumption_pc_ppp
        data_type: float
        description: Main outcome. Warns (not fails) on a few 1-person households above 2000, fix in gold.
        tests:
          - in_range:
              arguments: {min_value: 0, max_value: 2000}
              config: {severity: warn}
      - name: food_share
        data_type: float
        tests:
          - in_range: {arguments: {min_value: 0, max_value: 1}}

  - name: slv_uganda_households
    description: One row per Uganda household with random assignment and baseline characteristics.
    columns:
      - name: household_id
        tests: [unique, not_null]
      - name: treated
        tests:
          - accepted_values: {arguments: {values: [0, 1], quote: false}}
      - name: cohort
        tests:
          - accepted_values: {arguments: {values: [1, 2, 17, 18, 19, 20], quote: false}}

  # kenya
  - name: slv_kenya_households
    description: >
      One row per Kenya household. arm = treatment, spillover (not treated but in a treatment
      village) or pure_control (control villages, no baseline survey).
    config:
      contract: {enforced: true}
    columns:
      - name: household_id
        data_type: varchar
        constraints: [{type: not_null}]
        tests: [unique]
      - name: country
        data_type: varchar
      - name: village_id
        data_type: varchar
      - name: arm
        data_type: varchar
        tests:
          - not_null
          - accepted_values: {arguments: {values: [treatment, spillover, pure_control]}}
      - name: treated
        data_type: number
      - name: lump_sum
        data_type: boolean
      - name: large_transfer
        data_type: boolean
      - name: female_recipient
        data_type: boolean
      - name: hh_size_bl
        data_type: number
        tests:
          - in_range: {arguments: {min_value: 1, max_value: 30}}
      - name: children_bl
        data_type: number
      - name: has_children_bl
        data_type: boolean
      - name: respondent_age_bl
        data_type: float
      - name: married_bl
        data_type: boolean
      - name: respondent_education_years_bl
        data_type: float
      - name: hh_size_el
        data_type: number
      - name: consumption_missing_bl
        data_type: boolean

  - name: slv_kenya_household_consumption
    description: One row per Kenya household x wave with monthly consumption in PPP dollars (as published).
    tests:
      - unique_combination: {arguments: {columns: [household_id, wave]}}
    columns:
      - name: household_id
        tests:
          - not_null
          - relationships: {arguments: {to: ref('slv_kenya_households'), field: household_id}}
      - name: consumption_pc_ppp
        tests:
          - in_range: {arguments: {min_value: 0, max_value: 2000}}
      - name: food_share
        tests:
          - in_range: {arguments: {min_value: 0, max_value: 1}}

  # graduation programme (6 countries)
  - name: slv_graduation_households
    description: Households from the 6-country graduation programme (not cash). Consumption in 2014 USD PPP.
    tests:
      - unique_combination: {arguments: {columns: [country, household_id]}}
    columns:
      - name: country
        tests:
          - not_null
          - accepted_values: {arguments: {values: [ETH, GHA, HND, IND, PAK, PER]}}
      - name: treated
        tests:
          - accepted_values: {arguments: {values: [0, 1], quote: false}}
      - name: consumption_pc_bl
        tests:
          - in_range: {arguments: {min_value: 0}}
